<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-label="2025년 기업 부서별 AI 지출. 코딩 40억 달러, IT 운영 7억 달러, 마케팅 6.6억 달러, 고객 성공 6.3억 달러.">
  <style>
    :root {
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --series-1: #2a78d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-1: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --series-1: #3987e5;
      }
    }
    .bg { fill: var(--surface-1); }
    .title { fill: var(--text-primary); font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub { fill: var(--text-muted); font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cat { fill: var(--text-primary); font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .val { fill: var(--text-secondary); font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    .tick { fill: var(--text-muted); font: 400 10px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="286" rx="6"/>

  <text class="title" x="16" y="24">2025년 기업 부서별 AI 지출 — 코딩이 절반 이상</text>
  <text class="sub" x="16" y="42">단위: 10억 달러 · 부서별 AI 총지출 73억 달러 중</text>
  <text class="sub" x="16" y="58">출처: Menlo Ventures, 2025 State of Generative AI in the Enterprise (2025-12-09)</text>

  <g class="grid">
    <line x1="266.7" y1="76" x2="266.7" y2="236"/>
    <line x1="383.3" y1="76" x2="383.3" y2="236"/>
    <line x1="500" y1="76" x2="500" y2="236"/>
    <line x1="616.7" y1="76" x2="616.7" y2="236"/>
  </g>
  <line class="axis" x1="150" y1="76" x2="150" y2="236"/>

  <text class="cat" x="142" y="101" text-anchor="end">코딩</text>
  <path fill="var(--series-1)" d="M150,84 H612.7 a4,4 0 0 1 4,4 V106 a4,4 0 0 1 -4,4 H150 Z"/>
  <text class="val" x="632.7" y="102">$4.0B</text>

  <text class="cat" x="142" y="139" text-anchor="end">IT 운영</text>
  <path fill="var(--series-1)" d="M150,122 H227.7 a4,4 0 0 1 4,4 V144 a4,4 0 0 1 -4,4 H150 Z"/>
  <text class="val" x="247.7" y="140">$0.70B</text>

  <text class="cat" x="142" y="177" text-anchor="end">마케팅</text>
  <path fill="var(--series-1)" d="M150,160 H223 a4,4 0 0 1 4,4 V182 a4,4 0 0 1 -4,4 H150 Z"/>
  <text class="val" x="243" y="178">$0.66B</text>

  <text class="cat" x="142" y="215" text-anchor="end">고객 성공</text>
  <path fill="var(--series-1)" d="M150,198 H219.5 a4,4 0 0 1 4,4 V220 a4,4 0 0 1 -4,4 H150 Z"/>
  <text class="val" x="239.5" y="216">$0.63B</text>

  <line class="axis" x1="150" y1="236" x2="660" y2="236"/>
  <text class="tick" x="150" y="252" text-anchor="middle">0</text>
  <text class="tick" x="266.7" y="252" text-anchor="middle">1</text>
  <text class="tick" x="383.3" y="252" text-anchor="middle">2</text>
  <text class="tick" x="500" y="252" text-anchor="middle">3</text>
  <text class="tick" x="616.7" y="252" text-anchor="middle">4</text>
  <text class="sub" x="16" y="274">디자인(7%)·HR(5%)은 원문에 비율만 공개되어 금액 미표기 항목으로 제외.</text>
</svg>
