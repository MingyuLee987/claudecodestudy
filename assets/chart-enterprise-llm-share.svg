<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-label="엔터프라이즈 LLM API 점유율 3개년 변화. Anthropic 12퍼센트에서 24퍼센트를 거쳐 40퍼센트로, OpenAI 50퍼센트에서 50퍼센트를 거쳐 27퍼센트로, Google 7퍼센트에서 7퍼센트를 거쳐 21퍼센트로 변화.">
  <style>
    :root {
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --s-2023: #86b6ef;
      --s-2024: #2a78d6;
      --s-2025: #104281;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-1: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --s-2023: #9ec5f4;
        --s-2024: #3987e5;
        --s-2025: #184f95;
      }
    }
    .bg { fill: var(--surface-1); }
    .title { fill: var(--text-primary); font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub { fill: var(--text-muted); font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cat { fill: var(--text-primary); font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .val { fill: var(--text-secondary); font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    .tick { fill: var(--text-muted); font: 400 10px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    .leg { fill: var(--text-secondary); font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="352" rx="6"/>

  <text class="title" x="16" y="24">엔터프라이즈 LLM API 점유율 — 3개년 변화</text>
  <text class="sub" x="16" y="42">단위: % · 출처: Menlo Ventures, 2025 State of Generative AI in the Enterprise (2025-12-09, n≈495)</text>

  <!-- legend -->
  <g>
    <rect x="16" y="56" width="10" height="10" rx="2" fill="var(--s-2023)"/>
    <text class="leg" x="32" y="65">2023</text>
    <rect x="76" y="56" width="10" height="10" rx="2" fill="var(--s-2024)"/>
    <text class="leg" x="92" y="65">2024</text>
    <rect x="136" y="56" width="10" height="10" rx="2" fill="var(--s-2025)"/>
    <text class="leg" x="152" y="65">2025</text>
  </g>

  <!-- gridlines -->
  <g class="grid">
    <line x1="218.2" y1="80" x2="218.2" y2="312"/>
    <line x1="316.4" y1="80" x2="316.4" y2="312"/>
    <line x1="414.5" y1="80" x2="414.5" y2="312"/>
    <line x1="512.7" y1="80" x2="512.7" y2="312"/>
    <line x1="610.9" y1="80" x2="610.9" y2="312"/>
  </g>
  <line class="axis" x1="120" y1="80" x2="120" y2="312"/>

  <!-- Anthropic -->
  <text class="cat" x="112" y="115" text-anchor="end">Anthropic</text>
  <path fill="var(--s-2023)" d="M120,84 H233.8 a4,4 0 0 1 4,4 V98 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="245.8" y="96">12</text>
  <path fill="var(--s-2024)" d="M120,104 H351.6 a4,4 0 0 1 4,4 V118 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="363.6" y="116">24</text>
  <path fill="var(--s-2025)" d="M120,124 H508.7 a4,4 0 0 1 4,4 V138 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="520.7" y="136">40</text>

  <!-- OpenAI -->
  <text class="cat" x="112" y="193" text-anchor="end">OpenAI</text>
  <path fill="var(--s-2023)" d="M120,162 H606.9 a4,4 0 0 1 4,4 V176 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="618.9" y="174">50</text>
  <path fill="var(--s-2024)" d="M120,182 H606.9 a4,4 0 0 1 4,4 V196 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="618.9" y="194">50</text>
  <path fill="var(--s-2025)" d="M120,202 H381.1 a4,4 0 0 1 4,4 V216 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="393.1" y="214">27</text>

  <!-- Google -->
  <text class="cat" x="112" y="271" text-anchor="end">Google</text>
  <path fill="var(--s-2023)" d="M120,240 H184.7 a4,4 0 0 1 4,4 V254 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="196.7" y="252">7</text>
  <path fill="var(--s-2024)" d="M120,260 H184.7 a4,4 0 0 1 4,4 V274 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="196.7" y="272">7</text>
  <path fill="var(--s-2025)" d="M120,280 H322.2 a4,4 0 0 1 4,4 V294 a4,4 0 0 1 -4,4 H120 Z"/>
  <text class="val" x="334.2" y="292">21</text>

  <!-- x axis -->
  <line class="axis" x1="120" y1="312" x2="660" y2="312"/>
  <text class="tick" x="120" y="328" text-anchor="middle">0</text>
  <text class="tick" x="218.2" y="328" text-anchor="middle">10</text>
  <text class="tick" x="316.4" y="328" text-anchor="middle">20</text>
  <text class="tick" x="414.5" y="328" text-anchor="middle">30</text>
  <text class="tick" x="512.7" y="328" text-anchor="middle">40</text>
  <text class="tick" x="610.9" y="328" text-anchor="middle">50</text>
  <text class="sub" x="16" y="345">2025년 조사에서 '기타(Meta Llama·Cohere·Mistral 등)'는 12%. 2023·2024년 기타 값은 원문에 공개되지 않아 제외.</text>
</svg>
